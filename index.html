<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>انتخابات</title>
<style>
:root {
  color-scheme: light;
  --navy: #0f1f4d;
  --blue: #3455a6;
  --gold: #ddc065;
  --green: #146344;
  --green-light: #e9f5ee;
  --paper: #f1ede1;
  --ink-muted: #465569;
  --line: #d8cfb8;
  font-family: Tahoma, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--navy); background: var(--paper); }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.header { background: var(--navy); color: white; border-bottom: 4px solid var(--gold); }
.header-inner, main { max-width: 780px; margin: auto; }
.header-inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 19px 16px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon { display: grid; place-items: center; width: 43px; height: 43px; flex: 0 0 43px; border: 1px solid var(--gold); border-radius: 12px; color: var(--gold); font-size: 23px; }
.brand small { font-size: 11px; color: #e1e7fc; }
h1 { margin: 3px 0 0; font-size: clamp(25px, 6vw, 37px); line-height: 1.15; }
.utility, .primary {
  border: 1px solid #a3abc0;
  border-radius: 11px;
  min-height: 44px;
  padding: 8px 13px;
  background: white;
  font-size: 13px;
  font-weight: bold;
}
.header .utility { border-color: #8292ba; background: transparent; color: white; }
.primary { background: var(--blue); color: white; border-color: var(--blue); }
.primary:disabled { background: #e2e5ec; border-color: #b8bfce; color: var(--ink-muted); }
main { padding: 14px 12px max(16px, env(safe-area-inset-bottom)); }
.table {
  padding: 12px;
  border: 1px solid #bcae86;
  border-radius: 22px;
  background: repeating-linear-gradient(135deg, #ffffff38 0 1px, transparent 1px 8px), #f8f5eb;
  box-shadow: 0 8px 20px #33290e16, inset 0 0 0 4px #fffcf1;
}
.bar, .section-title, .footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bar { border-bottom: 1px solid var(--line); padding: 0 0 10px; }
.bank, .moves { border-radius: 8px; background: #e5ebfa; color: var(--navy); padding: 6px 8px; font-size: 12px; font-weight: bold; }
.seats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 10px 0; }
#opponents { display: contents; }
.seat {
  display: grid;
  align-content: start;
  gap: 4px;
  min-height: 66px;
  padding: 7px;
  border: 1px solid #aab4cc;
  border-radius: 10px;
  background: white;
  text-align: start;
  font-size: 13px;
}
.seat small { color: var(--ink-muted); font-size: 11px; line-height: 1.45; }
.seat.active { border-color: #937025; box-shadow: inset 0 0 0 2px var(--gold); }
.turn { justify-self: start; background: var(--gold); border-radius: 4px; padding: 2px 5px; font-size: 10px; font-weight: bold; }
.event {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  margin: 8px 0 11px;
  padding: 7px 9px;
  background: #e5ebfa;
  border-radius: 8px;
  color: var(--navy);
  font-size: 12px;
  font-weight: bold;
  line-height: 1.45;
}
.event.success { background: var(--green-light); color: var(--green); }
.event.notice { background: #e9e5dc; color: #443d31; }
.event-icon { flex: 0 0 20px; text-align: center; font-size: 17px; }
.section-title { margin-bottom: 6px; }
.section-title h2 { margin: 0; font-size: 15px; }
.section-title small { font-size: 11px; color: var(--ink-muted); }
.regions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
.region {
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 3px;
  min-height: 74px;
  padding: 5px 2px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  box-shadow: 0 2px 0 #b5a88838;
  font-size: 11px;
  font-weight: bold;
  line-height: 1.2;
}
.region b { font-size: 19px; line-height: 1; }
.region small { color: var(--ink-muted); font-size: 10px; font-weight: normal; }
.region.locked { background: #e9e8e5; border-style: dashed; color: var(--ink-muted); }
.region.chosen { background: #fff6d8; border-color: #947124; box-shadow: inset 0 0 0 2px var(--gold); }
button.target { border-color: var(--blue); background: #eef2ff; box-shadow: inset 0 0 0 1px var(--blue); animation: highlight .9s ease-out; }
@keyframes highlight { from { box-shadow: inset 0 0 0 2px var(--gold); } }
.hand-panel { margin-top: 12px; padding: 11px 10px; border: 1px solid var(--line); border-radius: 17px; background: #fffdfa; }
.hand {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  padding: 9px 2px 7px;
}
@media (min-width: 520px) { .hand { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (min-width: 740px) { .hand { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
.card {
  position: relative;
  display: flex;

  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  min-height: 125px;
  padding: 7px 5px 9px;
  border: 1px solid #a4b2d3;
  border-radius: 12px;
  background: radial-gradient(ellipse at 50% 52%, #e1e9ff, #fff 74%);
  box-shadow: 0 3px 0 #192c5324;
  scroll-snap-align: start;
  font-size: 11px;
  line-height: 1.25;
  transition: transform .18s ease, box-shadow .18s ease;
}
.card small { width: 100%; padding: 4px 2px; border-radius: 5px; background: var(--navy); color: white; font-size: 10px; font-weight: bold; }
.card.vote small { background: #e5ebfa; color: var(--navy); }
.card b {
  display: grid;
  place-items: center;
  width: 58px;
  height: 49px;
  border: 1px solid #b7c1dd;
  border-radius: 50%;
  color: var(--navy);
  font-size: 25px;
}
.card.vote b { border-style: dashed; }
.card strong { min-height: 14px; }
.card:disabled { filter: saturate(.25); }
.card.selected { transform: translateY(-4px); border-color: #947124; box-shadow: inset 0 0 0 2px var(--gold), 0 3px 0 #192c5324; }
.check { position: absolute; top: 5px; inset-inline-end: 5px; border-radius: 50%; width: 18px; height: 18px; background: var(--gold); color: var(--navy); line-height: 18px; }
.footnote { margin: 7px 0 9px; min-height: 19px; font-size: 12px; line-height: 1.45; color: var(--ink-muted); }
.footer .primary { flex: 1; }
dialog { width: min(92vw, 430px); padding: 0; border: 1px solid #ac914a; border-radius: 18px; color: var(--navy); box-shadow: 0 20px 70px #09153765; }
dialog::backdrop { background: #0a143acf; }
dialog h2 { margin: 0; padding: 16px 18px; background: var(--navy); color: white; border-bottom: 3px solid var(--gold); font-size: 21px; }
#details { padding: 14px 18px 3px; font-size: 14px; line-height: 1.6; }
#choices { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 18px 18px; }
.results { display: grid; gap: 5px; padding: 0; margin: 0; list-style: none; }
.results li { display: flex; align-items: center; justify-content: space-between; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
.results li.first { background: #fff6d8; border-color: #ae9045; }
.results .turn { margin-inline-end: 6px; }
@media (min-width: 520px) {
  main { padding: 20px 16px; }
  .table, .hand-panel { padding: 16px; }
  .regions, .seats { gap: 9px; }
  .region { min-height: 82px; font-size: 13px; }
  .card { min-height: 135px; }
}
@media (max-width: 350px) {
  main { padding-inline: 8px; }
  .table { padding: 9px; }
  .region { font-size: 10px; }

}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Gold foil on blue card stock, with decorative printing inside the trim. */
.card {
  isolation: isolate;
  min-width: 0;
  scroll-snap-align: none;
  min-height: 155px;
  padding: 12px 8px 20px;
  border: 1px solid #90703d;
  border-radius: 12px;
  color: #ffe4a5;
  background: radial-gradient(ellipse at 47% 36%, #173878 0%, #0c2155 52%, #070f2e 100%);
  box-shadow: 0 3px 0 #040e28, 0 5px 8px #07122f35;
}
.card::before {
  content: '';
  position: absolute;
  inset: 4px;
  z-index: -1;
  border: 1px solid #dcb66a85;
  border-radius: 8px;
  pointer-events: none;
}
.card::after {
  content: '◆ ◆ ◆';
  position: absolute;
  inset-inline: 0;
  bottom: 8px;
  color: #ddbc76;
  font-size: 7px;
  letter-spacing: 2px;
  pointer-events: none;
}
.card small, .card.vote small {
  width: auto;
  padding: 0;
  color: #ffe4a5;
  background: transparent;
  font-size: 10px;
}
.card b, .card.vote b {
  width: 54px;
  height: 54px;
  border: 3px double #d7b46c;
  color: #fff0c7;
  background: #071638;
  box-shadow: 0 0 0 3px #c6a56938, inset 0 0 12px #bf9b5035;
}
.card strong { display: grid; place-items: center; min-height: 30px; font-size: 12px; text-align: center; }
.card:disabled { filter: saturate(.7); }
.card.selected {
  border-color: #ffe4a5;
  box-shadow: 0 0 0 2px #b08030, 0 4px 9px #07122f55;
}
.card .check { top: 33px; inset-inline-end: 8px; }
.card:focus-visible { outline-offset: 2px; }
@media (min-width: 520px) { .card { min-height: 160px; } }
[hidden] { display: none !important; }
h2, h3, p { margin-block: 0 8px; }
.welcome { padding: clamp(14px, 4vw, 28px); }
.welcome-title { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.welcome-title p, .entry-card p { color: var(--ink-muted); line-height: 1.65; margin: 0; font-size: 14px; }
#entry { margin: 16px 0 0; }
label { display: grid; gap: 5px; font-size: 14px; font-weight: bold; }
input, select {
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  border: 1px solid #a3abc0;
  border-radius: 8px;
  font: inherit;
  background: white;
  color: var(--navy);
}
input:focus, select:focus { outline: 2px solid var(--blue); outline-offset: 2px; }
#room-code { text-align: center; text-transform: uppercase; letter-spacing: 2px; }
.entry-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.entry-card { display: grid; align-content: start; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #fffdfa; }
.entry-card h3 { margin: 0; font-size: 16px; }
.entry-card p { min-height: 69px; }
#resume { margin-top: 12px; }
.connection { padding: 8px 12px; border: 1px solid #bf9843; border-radius: 9px; background: #fff6d8; line-height: 1.5; font-size: 13px; }
.connection.error { border-color: #a53f2d; color: #802e20; background: #fbe9e4; }
.connection.ok { border-color: #709f88; color: var(--green); background: var(--green-light); }
.room-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 3px 0 10px; border-bottom: 1px solid var(--line); }
.room-meta .utility { margin-inline-start: auto; }
.code-chip { padding: 6px 9px; border: 1px solid #c3ab65; border-radius: 8px; color: var(--navy); background: #fff5d8; font: 700 17px monospace; letter-spacing: 2px; }
.status-chip { font-size: 12px; font-weight: bold; color: var(--ink-muted); }
.seat { overflow-wrap: anywhere; }
.turn { align-self: end; }
.region { min-width: 0; }
.region small { text-align: center; }
.region .vote-values { color: var(--navy); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.region-section { margin-top: 13px; }
.region-section h3 { margin-bottom: 6px; font-size: 14px; }
details { margin-top: 9px; }
summary { cursor: pointer; padding: 8px 1px; font-weight: bold; font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls:empty { display: none; }
.choice-list { padding: 3px 0 0; }
.controls .primary:only-child { flex: 1; }
#action-form { padding: 14px 16px 16px; }
#action-fields { display: grid; gap: 12px; }
#action-controls { justify-content: space-between; margin-top: 16px; }
.action-error { margin: 12px 0; color: #802e20; }
.field-options { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 0; }
.field-options label { display: flex; align-items: center; gap: 8px; min-height: 42px; font-size: 13px; }
.field-options input { width: 18px; min-height: unset; }
.solo-link { margin: 16px 0 0; font-size: 14px; }
.card.selected { outline: 2px solid #92732d; outline-offset: 2px; }
.card { min-height: 140px; }
.card b { max-width: 100%; }
.card.unavailable { filter: saturate(.7); }
.muted-copy { color: var(--ink-muted); font-size: 13px; line-height: 1.6; }
.revealed { color: var(--green); }
.results-section + .results-section { margin-top: 14px; }
.results-section h3 { font-size: 14px; margin-bottom: 7px; }
.discards { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 0; }
.discards span { display: inline-block; padding: 4px 7px; border-radius: 6px; background: #eef1fa; font-size: 12px; }
[aria-busy="true"] .controls button, [aria-busy="true"] #entry button { cursor: wait; }
@media (max-width: 450px) {
  .entry-options { grid-template-columns: 1fr; }
  .entry-card p { min-height: 0; }
  .regions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.header-actions { display: flex; flex-wrap: wrap; justify-content: end; gap: 6px; }
.header-actions a { display: inline-flex; align-items: center; text-decoration: none; }
</style>
<body>
<header class="header"><div class="header-inner">
  <div class="brand"><span class="brand-icon" aria-hidden="true">◆</span><div><small>اللعب الجماعي</small><h1>انتخابات</h1></div></div>
  <nav class="header-actions" aria-label="روابط اللعبة"><a class="utility" href="/guide.html">دليل اللعب</a><button id="home" class="utility" hidden>شاشة الدخول</button></nav>
</div></header>
<main>
  <p id="connection" class="connection" role="status" hidden></p>
  <section id="welcome" class="table welcome">
    <div class="welcome-title"><h2>طاولة الانتخابات</h2><p>كوّن غرفة خاصة تضم من 3 إلى 6 مرشحين وحكمًا واحدًا.</p></div>
    <form id="entry">
      <label>اسمك على الطاولة<input name="name" id="player-name" maxlength="24" autocomplete="nickname" required></label>
      <div class="entry-options">
        <div class="entry-card">
          <h3>انضم إلى غرفة</h3>
          <label>كود الغرفة<input name="code" id="room-code" maxlength="10" dir="ltr" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="مثال ABC123"></label>
          <button type="submit" value="join" class="primary">ادخل كمرشح</button>
        </div>
        <div class="entry-card">
          <h3>افتح غرفة جديدة</h3><p>تدخل كحكم وتحصل على رابط دعوة تشاركه مع المرشحين.</p>
          <button type="submit" value="create" class="utility">أنشئ غرفة كحكم</button>
        </div>
      </div>
    </form>
    <div id="resume" hidden></div><p class="solo-link"><a href="/solo.html">العب فردي</a></p>
  </section>
  <div id="room" hidden></div>
</main>
<dialog id="action-dialog" aria-labelledby="action-title">
  <h2 id="action-title"></h2>
  <form id="action-form">
    <div id="action-fields"></div>
    <p id="action-error" class="action-error" role="alert" hidden></p>
    <div class="controls" id="action-controls"><button type="button" class="utility" id="cancel-action">إلغاء</button><button class="primary" id="apply-action" type="submit">تأكيد</button></div>
  </form>
</dialog>
<script src="app.js" defer></script>
</body></html>
